[project]
name = "warehouse-agent"
version = "0.1.0"
description = "AI-Native Data Warehouse + Guided Agent Prototype"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.4",
    "pydantic>=2",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "networkx>=3.2",
    "mdbtools>=0.1",  # For mdb-export CLI wrapper
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "slow: tests that make real LLM API calls",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
